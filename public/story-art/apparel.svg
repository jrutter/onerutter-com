    <path fill="none" stroke="#C45C32" stroke-width="7" stroke-linecap="round" d="M236 124 V292"/>
    <path fill="#0A1045" d="M448 150 h42 c8 0 14 10 12 20 v78 c32 8 70 20 82 40 8 14-2 24-18 22 H420 c-16 0-24-14-14-26 l22-28 c8-12 10-22 8-42 v-68 c0-12 6-16 10-16z"/>
    <rect x="36" y="40" width="150" height="112" rx="10" fill="none" stroke="#0A1045" stroke-width="10"/>
    <path fill="#C45C32" d="M36 40 h150 v22 H36 z"/>
    <rect x="52" y="74" width="40" height="40" fill="#0A1045"/>
    <rect x="100" y="74" width="70" height="8" fill="#0A1045"/>
    <rect x="100" y="90" width="54" height="8" fill="#0A1045"/>
  </g>
