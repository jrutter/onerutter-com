<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img">
  <title>A jacket, a boot, and a small storefront window</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="16" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="18" cy="19" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="560" height="440" fill="#F3EEE6"/>
  <rect width="560" height="440" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-10 70 C 70 24, 140 110, 220 58" stroke="#C45C32" stroke-width="14"/>
      <path d="M380 360 C 460 320, 510 400, 590 350" stroke="#0A1045" stroke-width="12"/>
    </g>
    <path fill="#0A1045" d="M150 118 L196 86 L236 124 L276 86 L322 118 L348 176 L336 300 L248 324 L160 300 L148 176 Z"/>
    <path fill="#0A1045" d="M158 150 L78 230 L104 262 L196 186 Z"/>
