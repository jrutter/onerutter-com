<svg xmlns="http://www.w3.org/2000/svg" width="540" height="480" viewBox="0 0 540 480" role="img">
  <title>A person at a laptop next to a small agent figure and a shopping bag</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="7" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="18" cy="20" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
