<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img">
  <title>Two website windows and a folded newsletter</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="14" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="5" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="20" cy="18" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="560" height="440" fill="#F3EEE6"/>
  <rect width="560" height="440" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-16 90 C 60 36, 120 120, 210 70" stroke="#C45C32" stroke-width="14"/>
      <path d="M380 40 C 460 100, 510 30, 590 80" stroke="#0A1045" stroke-width="12"/>
    </g>
    <g transform="rotate(-8 150 150)">
      <rect x="36" y="70" width="200" height="150" rx="12" fill="none" stroke="#0A1045" stroke-width="12"/>
      <path fill="#0A1045" d="M36 70 h200 v28 H36 z"/>
      <rect x="56" y="114" width="64" height="48" fill="#0A1045"/>
      <rect x="132" y="114" width="80" height="8" fill="#0A1045"/>
      <rect x="132" y="132" width="64" height="8" fill="#C45C32"/>
    </g>
    <g transform="rotate(5 400 150)">
      <rect x="300" y="58" width="200" height="150" rx="12" fill="none" stroke="#0A1045" stroke-width="12"/>
      <path fill="#C45C32" d="M300 58 h200 v28 H300 z"/>
      <rect x="320" y="104" width="160" height="10" fill="#0A1045"/>
      <rect x="320" y="124" width="120" height="8" fill="#0A1045"/>
      <rect x="320" y="142" width="140" height="8" fill="#0A1045"/>
    </g>
    <g transform="rotate(-3 280 300)">
      <path fill="#0A1045" d="M118 214 h300 l42 36 v130 H156 z"/>
      <path fill="#C45C32" d="M150 252 h110 v16 H150 z"/>
    </g>
  </g>
  <g fill="#F3EEE6" transform="rotate(-3 280 300)">
    <path d="M136 278 h250 l28 24 v78 H168 z"/>
  </g>
  <g fill="#0A1045" transform="rotate(-3 280 300)">
    <rect x="168" y="300" width="150" height="7"/>
    <rect x="168" y="316" width="120" height="6"/>
    <rect x="168" y="346" width="170" height="6"/>
    <rect x="168" y="360" width="130" height="6"/>
  </g>
  <g fill="#F3EEE6">
    <circle cx="58" cy="92" r="4" transform="rotate(-8 150 150)"/>
    <circle cx="72" cy="92" r="4" transform="rotate(-8 150 150)"/>
    <circle cx="86" cy="92" r="4" transform="rotate(-8 150 150)"/>
    <circle cx="324" cy="78" r="4" transform="rotate(5 400 150)"/>
    <circle cx="338" cy="78" r="4" transform="rotate(5 400 150)"/>
    <circle cx="352" cy="78" r="4" transform="rotate(5 400 150)"/>
  </g>
  <g fill="none" stroke="#F3EEE6" stroke-linecap="round">
    <path d="M150 230 h200" stroke-width="3" transform="rotate(-2 280 300)"/>
    <path d="M48 100 h80" stroke-width="2.5" transform="rotate(-8 150 150)"/>
  </g>
</svg>
