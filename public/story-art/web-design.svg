<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img">
  <title>A pencil resting on a sketched web page</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="8" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="20" cy="22" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="480" height="460" fill="#F3EEE6"/>
  <rect width="480" height="460" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-10 80 C 70 30, 120 120, 200 64" stroke="#C45C32" stroke-width="14"/>
      <path d="M300 400 C 380 360, 430 430, 500 390" stroke="#0A1045" stroke-width="12"/>
    </g>
    <g transform="rotate(-5 230 230)">
      <rect x="78" y="48" width="280" height="340" rx="8" fill="none" stroke="#0A1045" stroke-width="14"/>
      <rect x="102" y="74" width="232" height="36" fill="#0A1045"/>
      <rect x="102" y="128" width="86" height="110" fill="#0A1045"/>
      <rect x="204" y="128" width="130" height="12" fill="#0A1045"/>
      <rect x="204" y="152" width="110" height="8" fill="#0A1045"/>
      <rect x="204" y="172" width="122" height="8" fill="#C45C32"/>
      <rect x="204" y="192" width="90" height="8" fill="#0A1045"/>
      <rect x="102" y="260" width="232" height="8" fill="#0A1045"/>
      <rect x="102" y="280" width="180" height="8" fill="#0A1045"/>
      <rect x="102" y="300" width="200" height="8" fill="#0A1045"/>
    </g>
    <g transform="rotate(-36 360 300)">
      <rect x="250" y="286" width="168" height="20" rx="4" fill="#0A1045"/>
      <path fill="#C45C32" d="M418 286 L448 296 L418 306 Z"/>
    </g>
  </g>
  <g fill="none" stroke="#F3EEE6" stroke-linecap="round" transform="rotate(-5 230 230)">
    <path d="M110 86 h80" stroke-width="3"/>
    <path d="M116 148 v70" stroke-width="2.5"/>
    <path d="M250 292 h150" stroke-width="3" transform="rotate(-31 320 300)"/>
  </g>
  <ellipse cx="160" cy="200" rx="9" ry="3" fill="#F3EEE6" transform="rotate(-5 160 200)"/>
</svg>
