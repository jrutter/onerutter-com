      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" seed="15" result="grain"/>
      <feComponentTransfer in="grain" result="grainA">
        <feFuncA type="discrete" tableValues="0 0 0 0.25 0.55"/>
      </feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
