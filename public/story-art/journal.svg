<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img">
  <title>An open journal, handwritten on one page and laid out like a blog on the other</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="18" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="18" cy="19" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="560" height="400" fill="#F3EEE6"/>
  <rect width="560" height="400" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-16 60 C 70 16, 140 100, 220 48" stroke="#C45C32" stroke-width="14"/>
      <path d="M380 48 C 460 100, 520 30, 600 78" stroke="#0A1045" stroke-width="12"/>
    </g>
    <path fill="none" stroke="#0A1045" stroke-width="14" stroke-linejoin="round" d="M48 78 H250 L272 318 H70 Z"/>
    <path fill="none" stroke="#0A1045" stroke-width="14" stroke-linejoin="round" d="M272 78 H520 L498 318 H250 Z"/>
    <path fill="#0A1045" d="M258 78 h28 v240 h-28 z"/>
    <path fill="none" stroke="#0A1045" stroke-width="4" stroke-linecap="round" d="M96 130 c30-8 50 10 80-2 M92 162 c40 8 46-12 86 4 M100 194 c28-10 48 8 78-4 M94 226 c36 6 42-12 84 2 M108 258 c24-8 40 6 70-2"/>
    <rect x="310" y="112" width="150" height="16" fill="#C45C32"/>
    <rect x="310" y="146" width="160" height="8" fill="#0A1045"/>
    <rect x="310" y="164" width="130" height="8" fill="#0A1045"/>
    <rect x="310" y="182" width="150" height="8" fill="#0A1045"/>
    <rect x="310" y="210" width="70" height="54" fill="#0A1045"/>
    <rect x="392" y="210" width="78" height="8" fill="#0A1045"/>
    <rect x="392" y="228" width="64" height="8" fill="#0A1045"/>
    <g transform="rotate(-18 430 300)">
      <rect x="300" y="292" width="150" height="16" rx="4" fill="#0A1045"/>
      <path fill="#C45C32" d="M450 292 l28 8-28 8 z"/>
    </g>
  </g>
  <g fill="none" stroke="#F3EEE6" stroke-linecap="round">
    <path d="M268 100 v190" stroke-width="3"/>
    <path d="M318 118 h90" stroke-width="2.5"/>
    <path d="M320 224 v28" stroke-width="2"/>
  </g>
  <ellipse cx="140" cy="170" rx="8" ry="3" fill="#F3EEE6"/>
  <ellipse cx="400" cy="190" rx="9" ry="3" fill="#F3EEE6"/>
</svg>
