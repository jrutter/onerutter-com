<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img">
  <title>A thick closed book with a clay spine</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="2" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="20" cy="18" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="520" height="380" fill="#F3EEE6"/>
  <rect width="520" height="380" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-16 70 C 60 24, 130 110, 210 56" stroke="#C45C32" stroke-width="14"/>
      <path d="M340 40 C 420 96, 480 24, 560 72" stroke="#0A1045" stroke-width="12"/>
    </g>
    <g transform="rotate(-7 260 200)">
      <path fill="#0A1045" d="M300 78 L368 112 V312 L300 278 Z"/>
      <rect x="96" y="70" width="210" height="220" fill="#0A1045"/>
      <rect x="96" y="70" width="22" height="220" fill="#C45C32"/>
    </g>
  </g>
  <g fill="none" stroke="#F3EEE6" stroke-linecap="round" transform="rotate(-7 260 200)">
    <path d="M132 96 h150" stroke-width="3"/>
    <path d="M132 118 h120" stroke-width="3"/>
    <path d="M132 200 h160" stroke-width="2.5"/>
    <path d="M132 222 h130" stroke-width="2.5"/>
    <path d="M132 244 h146" stroke-width="2.5"/>
    <path d="M314 120 l48 22" stroke-width="2"/>
    <path d="M314 148 l48 22" stroke-width="2"/>
    <path d="M314 176 l48 22" stroke-width="2"/>
    <path d="M314 204 l48 22" stroke-width="2"/>
    <path d="M314 232 l48 22" stroke-width="2"/>
    <path d="M314 260 l40 18" stroke-width="2"/>
  </g>
  <ellipse cx="200" cy="160" rx="12" ry="4" fill="#F3EEE6" transform="rotate(-7 200 160)"/>
  <ellipse cx="230" cy="230" rx="9" ry="3" fill="#F3EEE6" transform="rotate(-7 230 230)"/>
</svg>
