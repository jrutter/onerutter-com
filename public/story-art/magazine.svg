<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img">
  <title>A magazine cover beside a phone with a simple mobile layout</title>
  <defs>
    <filter id="carve" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="10" result="grain"/>
      <feComponentTransfer in="grain" result="grainA"><feFuncA type="discrete" tableValues="0 0 0 0.3 0.58"/></feComponentTransfer>
      <feComposite in="grainA" in2="cut" operator="in" result="speck"/>
      <feBlend in="cut" in2="speck" mode="multiply"/>
    </filter>
    <pattern id="tooth" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.6" fill="#0A1045" opacity="0.14"/>
      <circle cx="19" cy="21" r="0.5" fill="#C45C32" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="520" height="440" fill="#F3EEE6"/>
  <rect width="520" height="440" fill="url(#tooth)"/>
  <g filter="url(#carve)">
    <g fill="none" stroke-linecap="round">
      <path d="M-10 80 C 70 28, 140 120, 220 64" stroke="#C45C32" stroke-width="14"/>
      <path d="M360 36 C 430 90, 480 24, 550 70" stroke="#0A1045" stroke-width="12"/>
    </g>
    <g transform="rotate(-6 200 220)">
      <rect x="48" y="48" width="280" height="340" fill="#0A1045"/>
      <circle cx="188" cy="180" r="70" fill="#C45C32"/>
      <rect x="78" y="280" width="180" height="14" fill="#F3EEE6"/>
      <rect x="78" y="306" width="140" height="10" fill="#F3EEE6"/>
      <rect x="78" y="326" width="160" height="10" fill="#F3EEE6"/>
    </g>
    <rect x="352" y="150" width="112" height="210" rx="16" fill="#0A1045"/>
  </g>
  <rect x="366" y="172" width="84" height="150" rx="4" fill="#F3EEE6"/>
  <g fill="#0A1045">
    <rect x="378" y="186" width="60" height="46"/>
    <rect x="378" y="242" width="60" height="8"/>
    <rect x="378" y="258" width="48" height="8"/>
    <rect x="378" y="274" width="60" height="8"/>
    <rect x="378" y="294" width="40" height="16" fill="#C45C32"/>
  </g>
  <g fill="none" stroke="#F3EEE6" stroke-linecap="round">
    <path d="M80 90 h180" stroke-width="3" transform="rotate(-6 200 220)"/>
    <path d="M120 160 c40-20 70 10 90-16" stroke-width="3" transform="rotate(-6 200 220)"/>
    <path d="M370 186 v120" stroke-width="2"/>
  </g>
  <ellipse cx="160" cy="200" rx="12" ry="4" fill="#F3EEE6" transform="rotate(-6 160 200)"/>
  <ellipse cx="400" cy="210" rx="7" ry="3" fill="#F3EEE6"/>
</svg>
